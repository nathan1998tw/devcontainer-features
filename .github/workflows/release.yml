name: Publish Dev Container Features

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - ".github/workflows/release.yml"
  schedule:
    # Every 6 hours
    - cron: "0 */6 * * *"

  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: publish-features
  cancel-in-progress: false

jobs:
  publish:
    name: Sync and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Check and sync OpenCode version
        id: sync
        shell: bash
        run: |
          set -euo pipefail

          FEATURE_FILE="src/opencode/devcontainer-feature.json"

          # Read the latest v2 CLI version from npm's latest dist-tag.
          UPSTREAM_VERSION="$(npm view @opencode/cli@latest version)"

          # Only accept stable x.y.z versions.
          if [[ ! "$UPSTREAM_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected OpenCode version: $UPSTREAM_VERSION"
            exit 1
          fi

          CURRENT_VERSION="$(jq -r '.version' "$FEATURE_FILE")"
          CURRENT_DEFAULT="$(jq -r '.options.version.default' "$FEATURE_FILE")"

          echo "Upstream version: $UPSTREAM_VERSION"
          echo "Feature version:  $CURRENT_VERSION"
          echo "Option default:   $CURRENT_DEFAULT"

          if [[ "$UPSTREAM_VERSION" == "$CURRENT_VERSION" &&
                "$UPSTREAM_VERSION" == "$CURRENT_DEFAULT" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "OpenCode is already up to date."
            exit 0
          fi

          # Keep Feature metadata and its default install version in sync.
          # If an enum exists, add the new version without removing old ones.
          jq --arg version "$UPSTREAM_VERSION" '
            .version = $version
            | .options.version.default = $version
            | if (.options.version | has("enum")) then
                .options.version.enum =
                  ((.options.version.enum + [$version]) | unique)
              else
                .
              end
          ' "$FEATURE_FILE" > "${FEATURE_FILE}.tmp"

          mv "${FEATURE_FILE}.tmp" "$FEATURE_FILE"

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "version=$UPSTREAM_VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Dev Container CLI
        if: github.event_name != 'schedule' || steps.sync.outputs.changed == 'true'
        run: npm install -g @devcontainers/cli

      - name: Login to GHCR
        if: github.event_name != 'schedule' || steps.sync.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish all features
        if: github.event_name != 'schedule'
        run: |
          devcontainer features publish ./src \
            --registry ghcr.io \
            --namespace ${{ github.repository_owner }}/devcontainer-features

      - name: Publish updated OpenCode feature
        if: github.event_name == 'schedule' && steps.sync.outputs.changed == 'true'
        shell: bash
        env:
          UPSTREAM_VERSION: ${{ steps.sync.outputs.version }}
        run: |
          set -euo pipefail

          FEATURE_ROOT="$RUNNER_TEMP/opencode-features"
          mkdir -p "$FEATURE_ROOT/opencode"
          cp -a src/opencode/. "$FEATURE_ROOT/opencode/"

          devcontainer features publish "$FEATURE_ROOT" \
            --registry ghcr.io \
            --namespace "${GITHUB_REPOSITORY_OWNER}/devcontainer-features"

          echo "Published OpenCode Feature version $UPSTREAM_VERSION"

      - name: Commit OpenCode version update
        if: steps.sync.outputs.changed == 'true'
        shell: bash
        env:
          UPSTREAM_VERSION: ${{ steps.sync.outputs.version }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/opencode/devcontainer-feature.json

          if git diff --cached --quiet; then
            echo "No metadata changes to commit."
            exit 0
          fi

          git commit -m "chore(opencode): sync version ${UPSTREAM_VERSION}"
          git push origin HEAD:main
