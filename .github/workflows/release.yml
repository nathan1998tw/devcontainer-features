name: Publish Dev Container Features

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - ".github/workflows/release.yml"
  schedule:
    # Every 6 hours
    - cron: "0 */6 * * *"

  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: publish-features
  cancel-in-progress: false

jobs:
  publish:
    name: Sync and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Check and sync feature versions
        id: sync
        shell: bash
        run: |
          set -euo pipefail

          sync_feature() {
            local feature_file="$1"
            local upstream_version="$2"
            local label="$3"
            local current_version current_default

            current_version="$(jq -r '.version' "$feature_file")"
            current_default="$(jq -r '.options.version.default' "$feature_file")"

            echo "${label} upstream version: ${upstream_version}"
            echo "${label} feature version:  ${current_version}"
            echo "${label} option default:   ${current_default}"

            if [[ "$upstream_version" == "$current_version" &&
                  "$upstream_version" == "$current_default" ]]; then
              echo "${label} is already up to date."
              return 1
            fi

            # Keep Feature metadata and its default install version in sync.
            # If an enum exists, add the new version without removing old ones.
            jq --arg version "$upstream_version" '
              .version = $version
              | .options.version.default = $version
              | if (.options.version | has("enum")) then
                  .options.version.enum =
                    ((.options.version.enum + [$version]) | unique)
                else
                  .
                end
            ' "$feature_file" > "${feature_file}.tmp"

            mv "${feature_file}.tmp" "$feature_file"
            echo "Updated ${label} to ${upstream_version}."
            return 0
          }

          OPENCODE_FEATURE_FILE="src/opencode/devcontainer-feature.json"
          OPENCODE_VERSION="$(npm view @opencode/cli@latest version)"

          if [[ ! "$OPENCODE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected OpenCode version: $OPENCODE_VERSION"
            exit 1
          fi

          GROK_FEATURE_FILE="src/grok/devcontainer-feature.json"
          GROK_CHANNEL="$(jq -r '.options.channel.default' "$GROK_FEATURE_FILE")"

          case "$GROK_CHANNEL" in
            stable|alpha|enterprise) ;;
            *)
              echo "::error::Unexpected Grok channel: $GROK_CHANNEL"
              exit 1
              ;;
          esac

          GROK_VERSION=""
          for base_url in \
            "https://x.ai/cli" \
            "https://storage.googleapis.com/grok-build-public-artifacts/cli"; do
            GROK_VERSION="$(curl -fsSL --max-time 30 "${base_url}/${GROK_CHANNEL}")" || continue
            GROK_VERSION="$(printf '%s' "$GROK_VERSION" | tr -d '[:space:]')"
            if [[ "$GROK_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9._]+)?$ ]]; then
              break
            fi
            GROK_VERSION=""
          done

          if [[ ! "$GROK_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9._]+)?$ ]]; then
            echo "::error::Unexpected Grok version: ${GROK_VERSION:-<empty>}"
            exit 1
          fi

          OPENCODE_CHANGED=false
          if sync_feature "$OPENCODE_FEATURE_FILE" "$OPENCODE_VERSION" "OpenCode"; then
            OPENCODE_CHANGED=true
          fi

          GROK_CHANGED=false
          if sync_feature "$GROK_FEATURE_FILE" "$GROK_VERSION" "Grok"; then
            GROK_CHANGED=true
          fi

          CHANGED=false
          if [[ "$OPENCODE_CHANGED" == "true" || "$GROK_CHANGED" == "true" ]]; then
            CHANGED=true
          fi

          echo "opencode_changed=$OPENCODE_CHANGED" >> "$GITHUB_OUTPUT"
          echo "opencode_version=$OPENCODE_VERSION" >> "$GITHUB_OUTPUT"
          echo "grok_changed=$GROK_CHANGED" >> "$GITHUB_OUTPUT"
          echo "grok_version=$GROK_VERSION" >> "$GITHUB_OUTPUT"
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Install Dev Container CLI
        if: github.event_name != 'schedule' || steps.sync.outputs.changed == 'true'
        run: npm install -g @devcontainers/cli

      - name: Login to GHCR
        if: github.event_name != 'schedule' || steps.sync.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish all features
        if: github.event_name != 'schedule'
        run: |
          devcontainer features publish ./src \
            --registry ghcr.io \
            --namespace ${{ github.repository_owner }}/devcontainer-features

      - name: Publish updated features
        if: github.event_name == 'schedule' && steps.sync.outputs.changed == 'true'
        shell: bash
        env:
          OPENCODE_CHANGED: ${{ steps.sync.outputs.opencode_changed }}
          OPENCODE_VERSION: ${{ steps.sync.outputs.opencode_version }}
          GROK_CHANGED: ${{ steps.sync.outputs.grok_changed }}
          GROK_VERSION: ${{ steps.sync.outputs.grok_version }}
        run: |
          set -euo pipefail

          FEATURE_ROOT="$RUNNER_TEMP/changed-features"
          published_features=()
          mkdir -p "$FEATURE_ROOT"

          if [[ "$OPENCODE_CHANGED" == "true" ]]; then
            mkdir -p "$FEATURE_ROOT/opencode"
            cp -a src/opencode/. "$FEATURE_ROOT/opencode/"
            published_features+=("OpenCode ${OPENCODE_VERSION}")
          fi

          if [[ "$GROK_CHANGED" == "true" ]]; then
            mkdir -p "$FEATURE_ROOT/grok"
            cp -a src/grok/. "$FEATURE_ROOT/grok/"
            published_features+=("Grok ${GROK_VERSION}")
          fi

          devcontainer features publish "$FEATURE_ROOT" \
            --registry ghcr.io \
            --namespace "${GITHUB_REPOSITORY_OWNER}/devcontainer-features"

          echo "Published: ${published_features[*]}"

      - name: Commit feature version updates
        if: steps.sync.outputs.changed == 'true'
        shell: bash
        env:
          OPENCODE_CHANGED: ${{ steps.sync.outputs.opencode_changed }}
          OPENCODE_VERSION: ${{ steps.sync.outputs.opencode_version }}
          GROK_CHANGED: ${{ steps.sync.outputs.grok_changed }}
          GROK_VERSION: ${{ steps.sync.outputs.grok_version }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            src/opencode/devcontainer-feature.json \
            src/grok/devcontainer-feature.json

          if git diff --cached --quiet; then
            echo "No metadata changes to commit."
            exit 0
          fi

          updates=()
          if [[ "$OPENCODE_CHANGED" == "true" ]]; then
            updates+=("opencode ${OPENCODE_VERSION}")
          fi
          if [[ "$GROK_CHANGED" == "true" ]]; then
            updates+=("grok ${GROK_VERSION}")
          fi

          git commit -m "chore: sync feature versions (${updates[*]})"
          git push origin HEAD:main
